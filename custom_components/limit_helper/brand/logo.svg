<svg width="1024" height="320" viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: var(--primary-color, #03a9f4);
    }
  </style>
  <!-- Left Icon Mark -->
  <g transform="translate(16, -16) scale(0.68)">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<!-- Stepped Gauge Outline -->
    <path d="M 112 360 A 180 180 0 1 1 400 360" fill="none" stroke-width="24" />
    <!-- Zone Notches / Thresholds -->
    <line x1="160" y1="210" x2="190" y2="230" stroke-width="18" />
    <line x1="256" y1="140" x2="256" y2="180" stroke-width="18" />
    <line x1="352" y1="210" x2="322" y2="230" stroke-width="18" />
    <!-- Pointer / Needle Indicator with Center Pivot -->
    <circle cx="256" cy="330" r="24" fill="currentColor" stroke="none" />
    <line x1="256" y1="330" x2="310" y2="220" stroke-width="18" />
    <!-- Limit Stop Line -->
    <line x1="140" y1="390" x2="372" y2="390" stroke-width="16" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(360, 96)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0f172a" letter-spacing="-1">
      Limit <tspan fill="#03a9f4">Helper</tspan>
    </text>
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#64748b" letter-spacing="0.5">
      Home Assistant Advanced Limit &amp; Hysteresis
    </text>
  </g>
</svg>
